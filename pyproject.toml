[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-quant-research"
version = "0.1.0"
description = "Institutional-style Binance USD-M Futures research and execution pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Codex"}
]
dependencies = [
  "numpy>=2.2.0",
  "pandas>=2.2.3",
  "pyarrow>=18.1.0",
  "PyYAML>=6.0.2",
  "requests>=2.32.3",
  "scikit-learn>=1.6.1",
  "fastapi>=0.116.0",
  "jinja2>=3.1.6",
  "uvicorn>=0.35.0",
  "websockets>=14.2",
  "xgboost>=2.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"binance_quant.paper" = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
